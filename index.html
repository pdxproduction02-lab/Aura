<!DOCTYPE html>
<html lang="en">
  <header>
  <div class="logo">AURA</div>
  <div class="subtitle">ARTIFICIAL INTELLIGENCE</div>

  <div class="header-actions">
    <button id="newChatButton" class="secondary-button">
      New Conversation
    </button>

    <button id="clearMemoryButton" class="secondary-button danger-button">
      Clear Memory
    </button>
  </div>
  </header>

  <body>
    <div class="app">
      <header>
        <div class="logo">AURA</div>
        <div class="subtitle">ARTIFICIAL INTELLIGENCE</div>
      </header>

      <main>
        <div class="welcome" id="welcome">
          <h1>Hello. I'm AURA.</h1>
          <p>What are we building today?</p>
        </div>

        <div class="chat" id="chat"></div>

        <div class="input-area">
          <input
            id="input"
            type="text"
            placeholder="Ask AURA..."
            autocomplete="off"
          />
          <button onclick="sendMessage()">➤</button>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
