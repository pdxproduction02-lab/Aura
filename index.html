<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>AURA — AI Assistant</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <header>
        <div class="logo">AURA</div>
        <div class="subtitle">ARTIFICIAL INTELLIGENCE</div>

        <div class="header-actions">
          <button id="newChatButton" class="secondary-button">
            New Conversation
          </button>

          <button
            id="clearMemoryButton"
            class="secondary-button danger-button"
          >
            Clear Memory
          </button>
        </div>
      </header>

      <div class="workspace">
        <aside class="history-panel">
          <div class="history-heading">
            <span>CONVERSATIONS</span>
            <button id="closeHistoryButton" class="mobile-close-button">
              ×
            </button>
          </div>

          <div id="conversationList" class="conversation-list"></div>
        </aside>

        <main>
          <div class="mobile-history-bar">
            <button id="openHistoryButton" class="history-toggle-button">
              ☰ History
            </button>
          </div>

          <div class="welcome" id="welcome">
            <h1>Hello. I'm AURA.</h1>
            <p>What are we building today?</p>
          </div>

          <div class="chat" id="chat"></div>

          <div class="input-area">
            <input
              id="input"
              type="text"
              placeholder="Ask AURA..."
              autocomplete="off"
            />

            <button onclick="sendMessage()">➤</button>
          </div>
        </main>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
